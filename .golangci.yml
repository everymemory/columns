# golangci-lint runs the linters the tree already keeps to. A new release of the
# linter changes what it checks, not whether the build passes: the schema version
# is pinned below and the workflow pins the binary, so neither can move on its own.

version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused

# v2 splits the formatters out of the linters, so gofmt and goimports are asked
# for here rather than in linters.enable, and goimports keeps its settings here.
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      # The sources group stdlib and the module's own subpackage apart from the
      # third-party block; goimports should not collapse them.
      local-prefixes:
        - github.com/everymemory/columns
